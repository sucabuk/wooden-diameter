
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wooden Diameter</title>

    <meta name="theme-color" content="#287a48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Wooden Diameter">

    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
    <main class="container">
        <img src="./icons/icon-512.png"
             alt="Wooden Diameter"
             style="display: block; width: 90px; height: 90px; object-fit: contain; margin: 0 auto 15px; border-radius: 20px;">
        <p>Výpočet minimálního průměru kulatiny pro požadovaný rozměr trámu.</p>

        <div class="calculator">
            <div class="input-group">
                <label for="sideA">Strana A (cm)</label>
                <input type="number"
                       id="sideA"
                       min="0"
                       step="any"
                       inputmode="decimal"
                       placeholder="Zadejte stranu A">
            </div>

            <div class="input-group">
                <label for="sideB">Strana B (cm)</label>
                <input type="number"
                       id="sideB"
                       min="0"
                       step="any"
                       inputmode="decimal"
                       placeholder="Zadejte stranu B">
            </div>

            <div class="input-group">
                <label for="reserve">Rezerva (cm)</label>
                <input type="number"
                       id="reserve"
                       min="0"
                       step="any"
                       inputmode="decimal"
                       value="0">
            </div>

            <button type="button" id="calculateBtn">
                Vypočítat průměr
            </button>

            <div class="result">
                <h2>Minimální průměr kulatiny</h2>
                <div id="resultValue" aria-live="polite">–</div>
            </div>
        </div>
    </main>

    <script src="./script.js"></script>

    <script>
                if ("serviceWorker" in navigator) {
                    window.addEventListener("load", () => {
                        navigator.serviceWorker.register("./service-worker.js")
                            .catch(error => console.error(
                                "Chyba Service Workeru:", error
                            ));
                    });
                }
    </script>
</body>
</html>
